# -----------------------------------------------------------------------------
# promote-dev-to-qa.yml
#
# Promotes an existing dev-stage application version to the qa stage AND
# publishes a signed Evidence attestation over the promotion event itself.
#
# The job runs in the **qa** GitHub Environment, so GitHub will only mint an
# OIDC token whose environment claim is `qa`. That token can only match the
# JFrog identity mapping bound to the qa integration, which maps to the
# `<app>-qa-svc` service user. A workflow that tried to run this with
# `environment: dev` would receive a token that JFrog rejects (no matching
# mapping) and the promote call would fail with 401.
#
# Signing key: the same ed25519 key provisioned by
# setup/03a-setup-signing-key.sh signs the promotion evidence, so every
# stage transition has a verifiable chain of custody.
# -----------------------------------------------------------------------------
name: promote-dev-to-qa

on:
  workflow_dispatch:
    inputs:
      app_version:
        description: 'Application version to promote (e.g. 1.0.42-1234567)'
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  promote:
    runs-on: ubuntu-latest
    environment: qa   # ← RBAC boundary. Approval prompt fires here.
    env:
      APP_NAME:         ${{ vars.POC_APP_NAME }}
      JF_URL:           ${{ vars.JF_URL }}
      JF_OIDC_PROVIDER: ${{ vars.JF_OIDC_PROVIDER }}    # qa-scoped OIDC integration
      EVD_KEY_ALIAS:    ${{ vars.POC_EVD_KEY_ALIAS }}

    steps:
      - name: Install JFrog CLI
        uses: jfrog/setup-jfrog-cli@v4
        with:
          version: latest
          oidc-provider-name: ${{ env.JF_OIDC_PROVIDER }}
          oidc-audience:      jfrog-${{ env.APP_NAME }}
          disable-auto-evidence-collection: true
        env:
          JF_URL: ${{ env.JF_URL }}

      - name: Materialise signing key
        env:
          POC_EVD_SIGNING_KEY: ${{ secrets.POC_EVD_SIGNING_KEY }}
        run: |
          [ -n "${POC_EVD_SIGNING_KEY}" ] || { echo "POC_EVD_SIGNING_KEY missing"; exit 1; }
          [ -n "${EVD_KEY_ALIAS}" ]       || { echo "POC_EVD_KEY_ALIAS missing"; exit 1; }
          mkdir -p "$RUNNER_TEMP/evd"
          printf '%s' "${POC_EVD_SIGNING_KEY}" > "$RUNNER_TEMP/evd/signing.key"
          chmod 600 "$RUNNER_TEMP/evd/signing.key"
          echo "EVD_KEY_PATH=$RUNNER_TEMP/evd/signing.key" >> "$GITHUB_ENV"

      - name: Show current identity
        run: |
          jf rt curl -sS api/system/ping
          echo "Attempting dev -> qa promotion for ${APP_NAME}@${{ inputs.app_version }}"

      # Gates configured by 03-setup-apptrust.sh are evaluated here. Failing
      # either the security or Rego gate stops the promotion — nothing moves.
      - name: Promote application version to qa
        run: |
          set +e
          output=$(jf apptrust version-promote "${APP_NAME}" "${{ inputs.app_version }}" QA 2>&1)
          exit_code=$?
          echo "${output}"
          if [ $exit_code -ne 0 ]; then
            reason=$(echo "${output}" | grep -o '"message":"[^"]*"' | head -1 | sed 's/"message":"//;s/"$//')
            [ -z "${reason}" ] && reason="${output}"
            echo "::error::Promotion DEV→QA failed: ${reason}"
            {
              echo "## Promotion DEV→QA Failed"
              echo "**Version:** ${{ inputs.app_version }}"
              echo "**Reason:** ${reason}"
            } >> "$GITHUB_STEP_SUMMARY"
            exit $exit_code
          fi

      - name: Sign promotion evidence
        run: |
          cat > /tmp/promotion.predicate.json <<JSON
          {
            "event":       "promotion",
            "source_stage":"dev",
            "target_stage":"qa",
            "application": "${APP_NAME}",
            "version":     "${{ inputs.app_version }}",
            "actor":       "${{ github.actor }}",
            "run_id":      "${{ github.run_id }}",
            "approved_at": "$(date -u +%FT%TZ)"
          }
          JSON
          jf evd create \
            --predicate           /tmp/promotion.predicate.json \
            --predicate-type      "https://jfrog.com/evidence/promotion/v1" \
            --application-key     "${APP_NAME}" \
            --application-version "${{ inputs.app_version }}" \
            --key                 "${EVD_KEY_PATH}" \
            --key-alias           "${EVD_KEY_ALIAS}"

      - name: Wipe signing key from disk
        if: always()
        run: rm -f "${EVD_KEY_PATH}" || true
