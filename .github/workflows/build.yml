# -----------------------------------------------------------------------------
# build.yml
#
# Dev-stage build pipeline.
#
#   1. Authenticate to JFrog via OIDC using the `dev` GitHub Environment.
#   2. Run `jf curation-audit` — reject if any package trips a Curation
#      blocking policy.
#   3. Build the docker image pulling base image + wheels from the curated
#      remotes.
#   4. Push the image to the dev-stage local repo.
#   5. Create an AppTrust application version tagged with the run id.
#   6. Execute the pytest suite.
#   7. Sign and publish THREE Evidence attestations against the application
#      version, all signed with the same key that was provisioned by
#      setup/03a-setup-signing-key.sh:
#         - test-results   (satisfies the Rego promotion gate)
#         - docker image   (image-digest attestation)
#         - provenance     (SLSA-style build provenance)
# -----------------------------------------------------------------------------
name: build

on:
  push:
    branches: [main]
    paths-ignore: [ 'docs/**', 'README.md' ]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # required for OIDC

jobs:
  build:
    name: build & publish to dev stage
    runs-on: ubuntu-latest
    environment: dev    # ← binds this job to the `dev` GitHub Environment
    env:
      APP_NAME:            ${{ vars.POC_APP_NAME }}
      JF_URL:              ${{ vars.JF_URL }}
      JF_DOCKER_REGISTRY:  ${{ vars.JF_DOCKER_REGISTRY }}
      JF_OIDC_PROVIDER:    ${{ vars.JF_OIDC_PROVIDER }}      # dev-scoped OIDC integration
      EVD_KEY_ALIAS:       ${{ vars.POC_EVD_KEY_ALIAS }}     # e.g. ultimate-demo-evd-key
      DEV_REPO:            ${{ vars.POC_APP_NAME }}-docker-dev-local
      PYPI_REMOTE:         ${{ vars.POC_APP_NAME }}-pypi-remote
      DOCKER_REMOTE:       ${{ vars.POC_APP_NAME }}-docker-remote

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      # ---------- 1. JFrog CLI + OIDC login -----------------------------------
      - name: Install JFrog CLI
        uses: jfrog/setup-jfrog-cli@v4
        with:
          version: latest
          oidc-provider-name: ${{ env.JF_OIDC_PROVIDER }}
          oidc-audience:      jfrog-${{ env.APP_NAME }}
        env:
          JF_URL: ${{ env.JF_URL }}

      - name: Verify JFrog auth + capture identity
        run: |
          jf rt ping
          jf config show
          echo "Authenticated as dev-stage identity for ${APP_NAME}."

      # ---------- 2. Load signing key into a scratch file ---------------------
      # The key was generated by setup/03a-setup-signing-key.sh and pushed as
      # a GitHub secret from that same script. It's used by every `jf evd
      # create` call below.
      - name: Materialise signing key
        env:
          POC_EVD_SIGNING_KEY: ${{ secrets.POC_EVD_SIGNING_KEY }}
        run: |
          if [ -z "${POC_EVD_SIGNING_KEY}" ]; then
            echo "ERROR: POC_EVD_SIGNING_KEY secret missing. Did you run setup/03a-setup-signing-key.sh?" >&2
            exit 1
          fi
          if [ -z "${EVD_KEY_ALIAS}" ]; then
            echo "ERROR: POC_EVD_KEY_ALIAS variable missing. Did 03a-setup-signing-key.sh run to completion?" >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/evd"
          printf '%s' "${POC_EVD_SIGNING_KEY}" > "$RUNNER_TEMP/evd/signing.key"
          chmod 600 "$RUNNER_TEMP/evd/signing.key"
          echo "EVD_KEY_PATH=$RUNNER_TEMP/evd/signing.key" >> "$GITHUB_ENV"

      # ---------- 3. Curation audit -------------------------------------------
      - name: Curation audit (Python)
        working-directory: app
        run: |
          python --version; pip --version
          jf pip-config --repo-resolve "${PYPI_REMOTE}"

          # --format=json produces a parseable report; there is no --fail flag.
          # curation-audit exits non-zero when blocked packages are found, but
          # we also parse the JSON to display exactly which packages were blocked
          # and under which policy.
          set +e
          jf curation-audit \
            --requirements-file=requirements.txt \
            --format=json \
            --log-level=DEBUG 2>&1 | tee /tmp/curation-audit.json
          AUDIT_RC=${PIPESTATUS[0]}
          set -e

          # Blocked packages appear as array items whose "blocked" array is
          # non-empty, or whose "status" field equals "blocked".
          BLOCKED=$(jq -r '
            if type == "array" then
              [ .[] | select(
                  (.blocked // [] | length) > 0
                  or .status == "blocked"
                ) ] | length
            elif type == "object" then
              ((.blockedPackages // []) | length)
            else 0 end
          ' /tmp/curation-audit.json 2>/dev/null || echo "0")

          if [ "${BLOCKED:-0}" -gt 0 ]; then
            echo "::error::Curation policy blocked ${BLOCKED} package(s):"
            jq -r '
              if type == "array" then
                .[] | select((.blocked // [] | length) > 0 or .status == "blocked") |
                "  BLOCKED \(.name)@\(.version)  policy=\( [.blocked[]?.policyName // empty, .policies[]?.policy // empty] | first // "unknown" )"
              else . end
            ' /tmp/curation-audit.json 2>/dev/null || true
            exit 1
          fi

          if [ "${AUDIT_RC}" -ne 0 ]; then
            echo "::error::Curation audit command failed (exit ${AUDIT_RC})"
            exit "${AUDIT_RC}"
          fi

          echo "Curation audit passed — no blocked packages."

      # ---------- 4. Docker build & push --------------------------------------
      - name: Docker login to JFrog
        run: jf docker login "${JF_DOCKER_REGISTRY}"

      - name: Compute image tag
        id: tag
        # NOTE: application version uses '-' rather than '+' as metadata
        # separator; some JFrog CLI versions reject '+' in the version arg.
        run: |
          echo "image=${JF_DOCKER_REGISTRY}/${DEV_REPO}/${APP_NAME}:${{ github.run_id }}" >> "$GITHUB_OUTPUT"
          echo "app_version=1.0.${{ github.run_number }}-${{ github.run_id }}"          >> "$GITHUB_OUTPUT"

      - name: Build image (curated base + curated wheels)
        working-directory: app
        run: |
          # `jf docker login` writes base64-encoded credentials to ~/.docker/config.json.
          # Decode them into a .netrc file so pip inside the Dockerfile can authenticate
          # without the credentials ever landing in an image layer (BuildKit secret mount).
          DOCKER_AUTH="$(jq -r --arg r "${JF_DOCKER_REGISTRY}" \
            '.auths[$r].auth // empty' ~/.docker/config.json 2>/dev/null || true)"
          if [ -z "${DOCKER_AUTH}" ]; then
            echo "::error::No Docker credentials found for ${JF_DOCKER_REGISTRY} — did jf docker login run?" >&2
            exit 1
          fi
          JF_USER="$(printf '%s' "${DOCKER_AUTH}" | base64 -d | cut -d: -f1)"
          JF_PASS="$(printf '%s' "${DOCKER_AUTH}" | base64 -d | cut -d: -f2-)"
          printf 'machine %s\nlogin %s\npassword %s\n' \
            "${JF_DOCKER_REGISTRY}" "${JF_USER}" "${JF_PASS}" \
            > "$RUNNER_TEMP/pip-netrc"
          chmod 600 "$RUNNER_TEMP/pip-netrc"

          DOCKER_BUILDKIT=1 docker build \
            --secret id=netrc,src="$RUNNER_TEMP/pip-netrc" \
            --build-arg JF_DOCKER_REGISTRY="${JF_DOCKER_REGISTRY}" \
            --build-arg JF_DOCKER_REMOTE="${DOCKER_REMOTE}" \
            --build-arg JF_PYPI_INDEX_URL="https://${JF_DOCKER_REGISTRY}/artifactory/api/pypi/${PYPI_REMOTE}/simple" \
            -t "${{ steps.tag.outputs.image }}" .

      - name: Push image to dev-stage repo
        id: push
        run: |
          jf docker push "${{ steps.tag.outputs.image }}" \
            --build-name="${APP_NAME}" --build-number="${{ github.run_id }}"
          # Resolve immutable digest — evidence must reference the digest,
          # not the mutable tag.
          digest="$(docker inspect --format='{{index .RepoDigests 0}}' "${{ steps.tag.outputs.image }}" | awk -F@ '{print $2}')"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Publish build info
        run: |
          jf rt build-collect-env "${APP_NAME}" "${{ github.run_id }}"
          jf rt build-add-git     "${APP_NAME}" "${{ github.run_id }}"
          jf rt build-publish     "${APP_NAME}" "${{ github.run_id }}"

      # ---------- 5. AppTrust application version -----------------------------
      - name: Create AppTrust application version
        run: |
          # positional args: <app-key> <version>
          # source is the build info published in the previous step.
          jf apptrust version-create "${APP_NAME}" "${{ steps.tag.outputs.app_version }}" \
            --source-type-builds="name=${APP_NAME}, id=${{ github.run_id }}"

      # ---------- 6. Tests ----------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test deps from curated PyPI
        working-directory: app
        run: |
          pip config set global.index-url "https://${JF_DOCKER_REGISTRY}/artifactory/api/pypi/${PYPI_REMOTE}/simple"
          pip install -r requirements-dev.txt

      - name: Run pytest suite
        working-directory: app
        run: |
          mkdir -p ../evidence
          pytest

      # ---------- 7a. Signed evidence: test results ---------------------------
      - name: Build test-results predicate
        id: predicate
        run: |
          report=evidence/pytest-report.json
          passed=$(jq '.summary.passed  // 0' "$report")
          failed=$(jq '.summary.failed  // 0' "$report")
          skipped=$(jq '.summary.skipped // 0' "$report")
          cat > evidence/test-results.predicate.json <<JSON
          {
            "framework": "pytest",
            "passed":  ${passed},
            "failed":  ${failed},
            "skipped": ${skipped},
            "run_id":  "${{ github.run_id }}",
            "commit":  "${{ github.sha }}"
          }
          JSON
          echo "passed=${passed}"  >> "$GITHUB_OUTPUT"
          echo "failed=${failed}"  >> "$GITHUB_OUTPUT"

      - name: Sign & attach test-results evidence
        run: |
          jf evd create \
            --predicate           evidence/test-results.predicate.json \
            --predicate-type      "https://jfrog.com/evidence/test-results/v1" \
            --application-key     "${APP_NAME}" \
            --application-version "${{ steps.tag.outputs.app_version }}" \
            --key                 "${EVD_KEY_PATH}" \
            --key-alias           "${EVD_KEY_ALIAS}"

      # ---------- 7b. Signed evidence: docker image (digest attestation) ------
      - name: Build docker-image predicate
        run: |
          cat > evidence/image.predicate.json <<JSON
          {
            "image":  "${{ steps.tag.outputs.image }}",
            "digest": "${{ steps.push.outputs.digest }}",
            "registry": "${JF_DOCKER_REGISTRY}",
            "repository": "${DEV_REPO}",
            "base_image": "${JF_DOCKER_REGISTRY}/${DOCKER_REMOTE}/library/python:3.12-slim",
            "built_by": "github-actions/${{ github.workflow }}",
            "run_id":  "${{ github.run_id }}"
          }
          JSON

      - name: Sign & attach docker-image evidence
        run: |
          # Attach at BOTH the application-version level (so promotion sees it)
          # AND the artifact level (so image consumers can verify).
          jf evd create \
            --predicate           evidence/image.predicate.json \
            --predicate-type      "https://jfrog.com/evidence/artifact/v1" \
            --application-key     "${APP_NAME}" \
            --application-version "${{ steps.tag.outputs.app_version }}" \
            --key                 "${EVD_KEY_PATH}" \
            --key-alias           "${EVD_KEY_ALIAS}"

          jf evd create \
            --predicate           evidence/image.predicate.json \
            --predicate-type      "https://jfrog.com/evidence/artifact/v1" \
            --subject-repo-path   "${DEV_REPO}/${APP_NAME}/${{ github.run_id }}/manifest.json" \
            --key                 "${EVD_KEY_PATH}" \
            --key-alias           "${EVD_KEY_ALIAS}"

      # ---------- 7c. Signed evidence: SLSA-style provenance ------------------
      - name: Build provenance predicate
        run: |
          cat > evidence/provenance.predicate.json <<JSON
          {
            "buildType": "https://jfrog.com/apptrust/build/v1",
            "builder":   { "id": "https://github.com/${{ github.repository }}/actions" },
            "invocation": {
              "configSource": {
                "uri": "git+https://github.com/${{ github.repository }}",
                "digest": { "sha1": "${{ github.sha }}" },
                "entryPoint": ".github/workflows/build.yml"
              },
              "environment": {
                "runId":        "${{ github.run_id }}",
                "runAttempt":   "${{ github.run_attempt }}",
                "actor":        "${{ github.actor }}",
                "ref":          "${{ github.ref }}",
                "eventName":    "${{ github.event_name }}"
              }
            },
            "materials": [
              { "uri": "git+https://github.com/${{ github.repository }}",
                "digest": { "sha1": "${{ github.sha }}" } },
              { "uri": "pkg:docker/${{ steps.tag.outputs.image }}",
                "digest": { "sha256": "${{ steps.push.outputs.digest }}" } }
            ]
          }
          JSON

      - name: Sign & attach provenance evidence
        run: |
          jf evd create \
            --predicate           evidence/provenance.predicate.json \
            --predicate-type      "https://slsa.dev/provenance/v1" \
            --application-key     "${APP_NAME}" \
            --application-version "${{ steps.tag.outputs.app_version }}" \
            --key                 "${EVD_KEY_PATH}" \
            --key-alias           "${EVD_KEY_ALIAS}"

      - name: Wipe signing key from disk
        if: always()
        run: rm -f "${EVD_KEY_PATH}" || true

      # ---------- 8. Summary --------------------------------------------------
      - name: Summary
        run: |
          {
            echo "### Build succeeded"
            echo ""
            echo "| field | value |"
            echo "|-------|-------|"
            echo "| application     | ${APP_NAME} |"
            echo "| version         | ${{ steps.tag.outputs.app_version }} |"
            echo "| image           | ${{ steps.tag.outputs.image }} |"
            echo "| image digest    | ${{ steps.push.outputs.digest }} |"
            echo "| tests passed    | ${{ steps.predicate.outputs.passed }} |"
            echo "| tests failed    | ${{ steps.predicate.outputs.failed }} |"
            echo "| signed evidence | test-results, docker-image, provenance |"
            echo "| key alias       | ${EVD_KEY_ALIAS} |"
          } >> "$GITHUB_STEP_SUMMARY"
